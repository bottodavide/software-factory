<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<style>
  :root {
    --bg: #f6f6f3; --surface: #ffffff; --sunken: #efefea; --line: #dcdcd4;
    --text: #1c1d1f; --muted: #66686d; --faint: #9a9ca1;
    --accent: #2753d6; --pass: #1f8a4c; --changes: #b35c00; --human: #c0265b;
    --merged: #5b4bc4; --skipped: #8a8c91;
    --pass-bg: #e3f4ea; --changes-bg: #fbeedd; --human-bg: #fbe4ec; --merged-bg: #ebe8fa;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121315; --surface: #1b1c1f; --sunken: #16171a; --line: #2c2e33;
      --text: #e8e8e6; --muted: #a0a2a8; --faint: #6c6e74;
      --accent: #7c9cff; --pass: #4cc483; --changes: #f0a24b; --human: #f06292;
      --merged: #a596ff; --skipped: #85878d;
      --pass-bg: #173326; --changes-bg: #3a2a14; --human-bg: #3d1a28; --merged-bg: #2a2545;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
           gap: 8px 24px; padding: 24px 24px 4px; }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  h1 small { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 13px; }
  .meta { font: 12px var(--mono); color: var(--muted); }
  .meta.err { color: var(--human); }
  .counts { display: flex; gap: 14px; padding: 4px 24px 0; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .counts b { color: var(--text); font-weight: 600; }

  .board { display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); gap: 14px;
           padding: 18px 24px 40px; overflow-x: auto; align-items: start; }
  .col h2 { margin: 0 0 10px; padding-bottom: 8px; border-bottom: 2px solid var(--line);
            font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
            display: flex; justify-content: space-between; }
  .col.human h2 { border-color: var(--human); color: var(--human); }
  .col.merged h2 { border-color: var(--merged); }
  .empty { color: var(--faint); font-size: 12px; padding: 6px 2px; }

  .card { width: 100%; text-align: left; display: block; background: var(--surface);
          border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; margin-bottom: 10px;
          transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.human { border-color: var(--human); background: var(--human-bg); }
  .card .id { font: 11px var(--mono); color: var(--muted); }
  .card .feat { margin: 3px 0 8px; font-weight: 550; line-height: 1.35;
                display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .rlabel { font: 10px var(--mono); color: var(--faint); width: 22px; }
  .chip { font: 10.5px var(--mono); padding: 1px 6px; border-radius: 99px; background: var(--sunken);
          color: var(--muted); border: 1px solid var(--line); }
  .chip.PASS { background: var(--pass-bg); color: var(--pass); border-color: transparent; }
  .chip.CHANGES { background: var(--changes-bg); color: var(--changes); border-color: transparent; }
  .chip.skipped { color: var(--skipped); border-style: dashed; }
  .flag { font: 10.5px var(--mono); color: var(--human); }

  .drawer { position: fixed; inset: 0 0 0 auto; width: min(760px, 100vw); background: var(--surface);
            border-left: 1px solid var(--line); visibility: hidden;
            transform: translateX(100%); transition: transform .2s ease, visibility 0s .2s; display: flex; flex-direction: column; z-index: 10; }
  .drawer.open { transform: none; visibility: visible; box-shadow: -12px 0 40px rgba(0,0,0,.12); transition: transform .2s ease; }
  .dhead { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: start; }
  .dhead h3 { margin: 0; font-size: 15px; }
  .dhead .sub { font: 12px var(--mono); color: var(--muted); margin-top: 4px; word-break: break-all; }
  .close { margin-left: auto; font-size: 20px; line-height: 1; padding: 2px 6px; color: var(--muted); }
  .dbody { display: grid; grid-template-columns: 210px 1fr; min-height: 0; flex: 1; }
  .files { border-right: 1px solid var(--line); overflow: auto; padding: 8px; background: var(--sunken); }
  .files button { display: block; width: 100%; text-align: left; padding: 5px 8px; border-radius: 6px;
                  font: 12px var(--mono); color: var(--muted); word-break: break-all; }
  .files button.on { background: var(--surface); color: var(--text); }
  .files .grp { font: 10px var(--mono); text-transform: uppercase; color: var(--faint); padding: 10px 8px 2px; }
  .doc { overflow: auto; padding: 18px 22px 40px; min-width: 0; }
  .doc h1, .doc h2, .doc h3, .doc h4 { margin: 1.2em 0 .4em; line-height: 1.3; }
  .doc h1 { font-size: 18px; } .doc h2 { font-size: 15px; } .doc h3, .doc h4 { font-size: 14px; }
  .doc code { font: 12.5px var(--mono); background: var(--sunken); padding: 1px 4px; border-radius: 4px; }
  .doc pre { background: var(--sunken); padding: 12px; border-radius: 8px; overflow: auto; font: 12px/1.5 var(--mono); }
  .doc pre code { background: none; padding: 0; }
  .doc blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .doc img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; }
  .doc table { border-collapse: collapse; font-size: 13px; } .doc td, .doc th { border: 1px solid var(--line); padding: 4px 8px; }
  .verdict { display: inline-block; font: 600 12px var(--mono); padding: 3px 10px; border-radius: 99px; margin-bottom: 6px; }
  .verdict.ok { background: var(--pass-bg); color: var(--pass); }
  .verdict.no { background: var(--changes-bg); color: var(--changes); }
  .verdict.hu { background: var(--human-bg); color: var(--human); }
  .diff .add { color: var(--pass); } .diff .del { color: var(--human); } .diff .hunk { color: var(--accent); }
  .note { color: var(--muted); }

  @media (max-width: 720px) {
    header, .counts { padding-left: 16px; padding-right: 16px; }
    .board { grid-template-columns: 1fr; padding: 16px; }
    .dbody { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files { border-right: 0; border-bottom: 1px solid var(--line); max-height: 30vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Software Factory <small id="repo"></small></h1>
  <div class="meta" id="meta">connecting…</div>
</header>
<div class="counts" id="counts"></div>
<main class="board" id="board" aria-live="polite"></main>

<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-labelledby="d-title">
  <div class="dhead">
    <div><h3 id="d-title"></h3><div class="sub" id="d-sub"></div></div>
    <button class="close" id="d-close" aria-label="Close">×</button>
  </div>
  <div class="dbody">
    <nav class="files" id="d-files" aria-label="Job files"></nav>
    <article class="doc" id="d-doc"></article>
  </div>
</aside>

<script>
const POLL_MS = 2000
const COLUMNS = [
  { key: 'spec', title: 'Spec' }, { key: 'build', title: 'Build' }, { key: 'review', title: 'Review' },
  { key: 'approve', title: 'Approve' }, { key: 'needs-human', title: 'Needs you', cls: 'human' },
  { key: 'merged', title: 'Merged', cls: 'merged' },
]
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
let state = { jobs: [], reviewers: [] }
let open = { job: null, path: null }

async function getJSON(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${res.status} ${url}`)
  return res.json()
}

function chips(verdicts, gates) {
  const g = gates ? `<span class="chip ${gates}" title="quality gates">gates</span>` : ''
  return g + state.reviewers.map((r) => {
    const v = verdicts?.[r]
    return `<span class="chip ${esc(v || '')}" title="${esc(r)}: ${esc(v || 'pending')}">${esc(r)}</span>`
  }).join('')
}

function card(job) {
  const rounds = job.rounds || []
  const current = job.stage === 'review'
    ? `<div class="row"><span class="rlabel">R${job.round}</span>${chips(job.reviews, job.gates === 'pending' ? null : job.gates)}</div>`
    : ''
  const history = rounds.filter((r) => !(job.stage === 'review' && r.name === `round-${job.round}`))
    .map((r) => `<div class="row"><span class="rlabel">R${esc(r.name.split('-')[1])}</span>${chips(r.verdicts, r.gates)}</div>`).join('')
  const risk = (job.risk || []).length ? `<div class="row flag">⚑ ${esc(job.risk.join(', '))}</div>` : ''
  const human = job.stage === 'needs-human'
  return `<button class="card ${human ? 'human' : ''}" data-job="${esc(job.id)}">
    <div class="id">${esc(job.id)}</div>
    <div class="feat">${esc(job.feature)}</div>
    ${history}${current}${risk}
    ${human && job.note ? `<div class="row note" style="font-size:12px">${esc(job.note)}</div>` : ''}
  </button>`
}

function render() {
  const by = Object.fromEntries(COLUMNS.map((c) => [c.key, []]))
  for (const j of state.jobs) if (by[j.stage]) by[j.stage].push(j)
  $('board').innerHTML = COLUMNS.map((c) => {
    const list = by[c.key].sort((a, b) => b.id.localeCompare(a.id))
    return `<section class="col ${c.cls || ''}"><h2><span>${c.title}</span><span>${list.length || ''}</span></h2>
      ${list.length ? list.map(card).join('') : '<div class="empty">—</div>'}</section>`
  }).join('')
  const active = state.jobs.filter((j) => !['merged', 'abandoned'].includes(j.stage)).length
  const waiting = by['needs-human'].length
  $('counts').innerHTML = `<span><b>${active}</b> active</span><span><b>${waiting}</b> waiting for you</span>
    <span><b>${by.merged.length}</b> merged</span>`
  document.title = waiting ? `(${waiting}) Software Factory` : 'Software Factory'
}

async function poll() {
  try {
    state = await getJSON('/api/jobs')
    render()
    $('meta').className = 'meta'
    $('meta').textContent = `live · ${new Date().toLocaleTimeString()}`
    if (open.job) await refreshDrawer(false)
  } catch (e) {
    $('meta').className = 'meta err'
    $('meta').textContent = `offline: ${e.message}`
  }
}

function inline(s) {
  const codes = []
  s = s.replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|\W)\*([^*\s][^*]*)\*(?=\W|$)/g, '$1<em>$2</em>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`)
}

function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n')
  let html = '', i = 0
  const head = (lines[0] || '').trim()
  const tone = /^(VERDICT: PASS|APPROVE|STATUS: READY)$/.test(head) ? 'ok'
    : /^(VERDICT: CHANGES|STATUS: BLOCKED)$/.test(head) ? 'no' : head === 'ESCALATE' ? 'hu' : null
  if (tone) { html += `<span class="verdict ${tone}">${esc(head)}</span>`; i = 1 }
  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }
    if (line.startsWith('```')) {
      const body = []; i++
      while (i < lines.length && !lines[i].startsWith('```')) body.push(lines[i++])
      i++; html += `<pre><code>${esc(body.join('\n'))}</code></pre>`; continue
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }
    if (line.startsWith('>')) {
      const body = []
      while (i < lines.length && lines[i].startsWith('>')) body.push(lines[i++].replace(/^>\s?/, ''))
      html += `<blockquote>${inline(body.join(' '))}</blockquote>`; continue
    }
    if (/^\|/.test(line)) {
      const rows = []
      while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++])
      html += '<table>' + rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r)).map((r, k) =>
        '<tr>' + r.replace(/^\||\|$/g, '').split('|').map((c) => `<${k ? 'td' : 'th'}>${inline(c.trim())}</${k ? 'td' : 'th'}>`).join('') + '</tr>').join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line), items = []
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        if (isList(lines[i])) items.push(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, ''))
        else items[items.length - 1] += ' ' + lines[i].trim()
        i++
      }
      const tag = ordered ? 'ol' : 'ul'
      html += `<${tag}>${items.map((t) => `<li>${inline(t.replace(/^\[( |x)\]\s*/, (_, x) => x === 'x' ? '☑ ' : '☐ '))}</li>`).join('')}</${tag}>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|>|\|)/.test(lines[i]) && !isList(lines[i])) para.push(lines[i++])
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}

function diffView(src) {
  return `<pre class="diff"><code>${src.split('\n').map((l) => {
    const cls = l.startsWith('+') && !l.startsWith('+++') ? 'add' : l.startsWith('-') && !l.startsWith('---') ? 'del' : l.startsWith('@@') ? 'hunk' : ''
    return cls ? `<span class="${cls}">${esc(l)}</span>` : esc(l)
  }).join('\n')}</code></pre>`
}

function defaultFile(job) {
  const order = ['decision.md', 'build.md', 'spec.md']
  const last = (job.rounds || [])[job.rounds.length - 1]
  if (job.stage === 'review' && last) {
    const changed = Object.entries(last.verdicts || {}).find(([, v]) => v === 'CHANGES')
    const pick = changed ? `${last.name}/review-${changed[0]}.md` : `${last.name}/gates.json`
    if (job.files.includes(pick)) return pick
  }
  return order.find((f) => job.files.includes(f)) || job.files[0] || null
}

async function refreshDrawer(reset) {
  const job = state.jobs.find((j) => j.id === open.job)
  if (!job) return
  if (reset || !open.path || !job.files.includes(open.path)) open.path = defaultFile(job)
  $('d-title').textContent = job.feature
  $('d-sub').textContent = `${job.id} · ${job.stage} · ${job.branch}${job.merged_commit ? ' · ' + job.merged_commit.slice(0, 8) : ''}`
  const groups = {}
  for (const f of job.files) {
    const g = f.includes('/') ? f.split('/')[0] : 'job'
    ;(groups[g] ||= []).push(f)
  }
  $('d-files').innerHTML = Object.entries(groups).map(([g, fs]) =>
    `<div class="grp">${esc(g)}</div>` + fs.map((f) =>
      `<button data-path="${esc(f)}" class="${f === open.path ? 'on' : ''}">${esc(g === 'job' ? f : f.slice(g.length + 1))}</button>`).join('')).join('')
  if (!open.path) { $('d-doc').innerHTML = '<p class="note">Nothing written yet.</p>'; return }
  if (!reset && $('d-doc').dataset.path === open.path && open.path.endsWith('.png')) return
  const url = `/api/file?job=${encodeURIComponent(job.id)}&path=${encodeURIComponent(open.path)}`
  if (open.path.endsWith('.png')) {
    $('d-doc').innerHTML = `<img alt="${esc(open.path)}" src="${url}">`
  } else {
    const res = await fetch(url, { cache: 'no-store' })
    const text = res.ok ? await res.text() : null
    if (text === null) $('d-doc').innerHTML = '<p class="note">Could not load this file.</p>'
    else if (open.path.endsWith('.md')) $('d-doc').innerHTML = markdown(text)
    else if (open.path.endsWith('.patch')) $('d-doc').innerHTML = diffView(text)
    else $('d-doc').innerHTML = `<pre><code>${esc(text)}</code></pre>`
  }
  $('d-doc').dataset.path = open.path
}

$('board').addEventListener('click', (e) => {
  const c = e.target.closest('.card'); if (!c) return
  open = { job: c.dataset.job, path: null }
  $('drawer').classList.add('open'); $('drawer').setAttribute('aria-hidden', 'false')
  refreshDrawer(true); $('d-close').focus()
})
$('d-files').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-path]'); if (!b) return
  open.path = b.dataset.path; refreshDrawer(false)
})
function closeDrawer() {
  $('drawer').classList.remove('open'); $('drawer').setAttribute('aria-hidden', 'true')
  const prev = document.querySelector(`.card[data-job="${CSS.escape(open.job || '')}"]`)
  open = { job: null, path: null }; prev?.focus()
}
$('d-close').addEventListener('click', closeDrawer)
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && open.job) closeDrawer() })

poll()
setInterval(poll, POLL_MS)
</script>
</body>
</html>
